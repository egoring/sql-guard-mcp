[project]
name = "sql-guard-mcp"
version = "0.1.0"
description = "Read-only SQL access for AI agents with layered safety guards - query validation, table allowlist, row caps, and execution time limits as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jinbeom Jeong", email = "jinbeomj90@gmail.com" }]
keywords = ["mcp", "sql", "sqlite", "agent-safety", "read-only"]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sql-guard-mcp = "sql_guard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_guard_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
